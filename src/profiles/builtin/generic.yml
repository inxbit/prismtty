profile:
  name: generic
  runtime:
    priority: 99
    local_baseline: true
    strong_signals: []
    startup_prompt: none
    runtime_prompt: none
rules:
  - description: IPv4 address
    regex: '\b(?<!\.)((25[0-5]|(2[0-4]|[0-1]?\d)?\d)\.){3}(25[0-5]|(2[0-4]|[0-1]?\d)?\d)(/(3[0-2]|[12]?\d))?(?!\.?\w|/)\b'
    color: f#00ffff
  - description: IPv6 address
    regex: '(?i)(?<![0-9a-z_:.])((([0-9a-f]{1,4}:){6}|::([0-9a-f]{1,4}:){0,5}|[0-9a-f]{1,4}::([0-9a-f]{1,4}:){0,4}|([0-9a-f]{1,4}:){2}:([0-9a-f]{1,4}:){0,3}|([0-9a-f]{1,4}:){3}:([0-9a-f]{1,4}:){0,2}|([0-9a-f]{1,4}:){4}:([0-9a-f]{1,4}:)?|([0-9a-f]{1,4}:){5}:)((25[0-5]|(2[0-4]|[0-1]?\d)?\d)\.){3}(25[0-5]|(2[0-4]|[0-1]?\d)?\d)|([0-9a-f]{1,4}:){7}[0-9a-f]{1,4}|([0-9a-f]{1,4}:){1,7}:|([0-9a-f]{1,4}:){1,6}:[0-9a-f]{1,4}|([0-9a-f]{1,4}:){1,5}(:[0-9a-f]{1,4}){1,2}|([0-9a-f]{1,4}:){1,4}(:[0-9a-f]{1,4}){1,3}|([0-9a-f]{1,4}:){1,3}(:[0-9a-f]{1,4}){1,4}|([0-9a-f]{1,4}:){1,2}(:[0-9a-f]{1,4}){1,5}|[0-9a-f]{1,4}:(:[0-9a-f]{1,4}){1,6}|:((:[0-9a-f]{1,4}){1,7}|:))(%[0-9a-z]+([_.-][0-9a-z]+)*)?(/(12[0-8]|1[01]\d|[1-9]?\d))?(?![0-9a-z:]|\.\w|/)'
    color: f#00ffff
  - description: MAC address
    regex: '(?i)\b((?<!:)([\da-f]{1,2}:){5}[\da-f]{1,2}(?!:)|(?<!\.)([\da-f]{4}\.){2}[\da-f]{4}(?!\.))\b'
    color: f#ff9aff
    exclusive: true
  # The last alternative is a "not" at the end of the text being matched,
  # which is a "not" matched without the word after it: the read ended there
  # or inside the next word, the input ended without a line end, or, on a
  # terminal, the line ended there. "not connected" cut that way was drawn as
  # a plain "not" and a green "connected". It is part of this rule, not a
  # rule of its own, so the profile takes no extra rule out of the limit a
  # user's own rules share with it.
  - description: bad operational state
    regex: '(?i)\b((password|abnormal(ly)?|down|los(t|s|ing)|err(or(s)?)?|den(y|ies|ied)|reject(ing|ed)?|drop(ped|s)?|fail(s|ed|ures?)?|not[ \t-]+(connect(ed)?|reachable)|disconnect(ed)?|unreachable|invalid|bad|notconnect|unusable|blocking|blocked|collision(s)?|unsynchronized|mismatch|runts|CRC|resets)\b|not[ \t-]+\z)'
    color: f#ff0000 bold
  - description: warning state
    regex: '(?i)\b(warning(s)?|degraded|standby|learning|listening|passive)\b'
    color: f#ffff00
  # "not" takes its blanks all at once (`++`): no good-state word starts
  # with a blank or a hyphen, so giving one back never finds a word. PCRE2
  # cannot see that through `(?&good)`. Without JIT it gave a long run of
  # blanks back one at a time until the rule's match limit ran out, and the
  # rule was switched off. `enabled?` (not `enable(d)?`) pays for the extra
  # `+`: the pattern's bytes count toward the limit a user's own rules
  # share with the profile.
  - description: good operational state
    regex: '(?i)\bnot[ \t-]++(?&good)\b(*SKIP)(*F)|\b(?<good>up|ok(ay)?|permit(t?ed|s)?|accept(s|ed)?|enabled?|online|succe((ss(ful|fully)?)|ed(ed)?)?|connect(?:ed|(?![ \t]+to[ \t]+host\b))|reachable|valid|forwarding|synchronized|active)\b'
    color: f#00ff00
  - description: syslog severe
    regex: '(%\w+(?:-\w+)?-[0-3]-\w+)\b'
    color: f#ff3333 bold
  - description: syslog warning
    regex: '(%\w+(?:-\w+)?-[4-5]-\w+)\b'
    color: f#ffff00
  - description: syslog info
    regex: '(%\w+(?:-\w+)?-[6-7]-\w+)\b'
    color: f#65d7fd
