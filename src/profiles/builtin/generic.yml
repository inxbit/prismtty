profile:
  name: generic
  runtime:
    priority: 99
    local_baseline: true
    strong_signals: []
    startup_prompt: none
    runtime_prompt: none
rules:
  - description: IPv4 address
    regex: '\b(?<!\.)((25[0-5]|(2[0-4]|[0-1]?\d)?\d)\.){3}(25[0-5]|(2[0-4]|[0-1]?\d)?\d)(/(3[0-2]|[12]?\d))?(?![.\d]|/)\b'
    color: f#00ffff
  - description: IPv6 address
    regex: '(?i)(?<![0-9a-f:.])(([0-9a-f]{1,4}:){7}[0-9a-f]{1,4}|([0-9a-f]{1,4}:){1,7}:|([0-9a-f]{1,4}:){1,6}:[0-9a-f]{1,4}|([0-9a-f]{1,4}:){1,5}(:[0-9a-f]{1,4}){1,2}|([0-9a-f]{1,4}:){1,4}(:[0-9a-f]{1,4}){1,3}|([0-9a-f]{1,4}:){1,3}(:[0-9a-f]{1,4}){1,4}|([0-9a-f]{1,4}:){1,2}(:[0-9a-f]{1,4}){1,5}|[0-9a-f]{1,4}:(:[0-9a-f]{1,4}){1,6}|:((:[0-9a-f]{1,4}){1,7}|:))(%[0-9a-z]+)?(/(12[0-8]|1[01]\d|[1-9]?\d))?(?![0-9a-z:.]|/)'
    color: f#00ffff
  - description: MAC address
    regex: '(?i)\b((?<!:)([\da-f]{1,2}:){5}[\da-f]{1,2}(?!:)|(?<!\.)([\da-f]{4}\.){2}[\da-f]{4}(?!\.))\b'
    color: f#ff9aff
    exclusive: true
  - description: bad operational state
    regex: '(?i)\b(password|abnormal(ly)?|down|los(t|s|ing)|err(or(s)?)?|den(y|ies|ied)?|reject(ing|ed)?|drop(ped|s)?|fail(s|ed|ure)?|not[ -]connect(ed)?|disconnect(ed)?|unreachable|invalid|bad|notconnect|unusable|blocking|blocked|collision(s)?|unsynchronized|mismatch|runts|CRC|resets)\b'
    color: f#ff0000 bold
  - description: warning state
    regex: '(?i)\b(warning(s)?|degraded|standby|learning|listening|passive)\b'
    color: f#ffff00
  - description: good operational state
    regex: '(?i)\b(up|ok(ay)?|permit(ed|s)?|accept(s|ed)?|enable(d)?|online|succe((ss(ful|fully)?)|ed(ed)?)?|(?<!not )(?<!not-)connect(ed)?|reachable|valid|forwarding|synchronized|active)\b'
    color: f#00ff00
  - description: syslog severe
    regex: '(%\w+-[0-3]-\w+)\b'
    color: f#ff3333 bold
  - description: syslog warning
    regex: '(%\w+-[4-5]-\w+)\b'
    color: f#ffff00
  - description: syslog info
    regex: '(%\w+-[6-7]-\w+)\b'
    color: f#65d7fd
