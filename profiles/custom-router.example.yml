profile:
  name: custom-router
  inherits: [generic]
  detection:
    - CustomOS
rules:
  - description: CustomOS interface
    regex: '\bcust\d+/\d+\b'
    color: f#00ffff bold
  # Role words like "primary" or "standby" appear in plenty of unrelated
  # output, so anchor the rule to its HA context instead of matching the bare
  # word; otherwise every "primary uplink" line would light up.
  - description: CustomOS HA role
    regex: '(?i)\bha (?:role|state): (primary|secondary|standby)\b'
    color: f#ffff00
