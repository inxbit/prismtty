<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">PrismTTY terminal output highlighting</title>
  <desc id="desc">Noise becomes signal beside a dark terminal showing highlighted network output.</desc>
  <defs>
    <style>
      @font-face {
        font-family: "Space Grotesk";
        src: url("./fonts/space-grotesk-latin.woff2") format("woff2");
        font-weight: 400 700;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("./fonts/jetbrains-mono-latin.woff2") format("woff2");
        font-weight: 400 800;
      }
      .sans { font-family: "Space Grotesk", sans-serif; }
      .mono { font-family: "JetBrains Mono", monospace; }
      .brand { fill: #f2f5f7; font-size: 24px; font-weight: 650; }
      .headline { fill: #f2f5f7; font-size: 70px; font-weight: 650; letter-spacing: -3px; }
      .lede { fill: #a9b4bf; font-size: 23px; font-weight: 450; }
      .meta { fill: #8f9ba8; font-size: 16px; font-weight: 550; letter-spacing: 0.4px; }
      .terminal-title { fill: #8f9ba8; font-size: 14px; }
      .terminal-text { fill: #d8dee5; font-size: 15px; }
      .host { fill: #8bd450; font-weight: 700; }
      .iface { fill: #f3bd4f; }
      .ip { fill: #55d6e8; }
      .up { fill: #5edb8a; font-weight: 700; }
      .down { fill: #e678a8; font-weight: 700; }
      .severity { fill: #ad8ce5; font-weight: 700; }
    </style>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#05070a"/>
      <stop offset="0.62" stop-color="#07090d"/>
      <stop offset="1" stop-color="#091116"/>
    </linearGradient>
    <radialGradient id="cyan-atmosphere" cx="0" cy="0" r="1" gradientTransform="translate(984 82) rotate(139) scale(590 430)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#45c7d8" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#45c7d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="prism-stroke" x1="76" x2="150" y1="44" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f2f5f7"/>
      <stop offset="0.48" stop-color="#55d6e8"/>
      <stop offset="1" stop-color="#ad8ce5"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#45c7d8" stroke-opacity="0.035"/>
    </pattern>
    <filter id="terminal-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#cyan-atmosphere)"/>
  <rect x="600" width="600" height="630" fill="url(#grid)"/>

  <g aria-hidden="true">
    <path d="M72 104L108 42l40 62Z" fill="none" stroke="url(#prism-stroke)" stroke-width="5" stroke-linejoin="round"/>
    <rect x="82" y="68" width="54" height="32" rx="5" fill="#0d1117" stroke="#2a3441"/>
    <path d="M91 87l8-6-8-6" fill="none" stroke="#55d6e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M105 91h18" stroke="#8bd450" stroke-width="3" stroke-linecap="round"/>
    <path d="M153 64h48" stroke="#55d6e8" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
    <path d="M153 78h58" stroke="#8bd450" stroke-width="7" stroke-linecap="round" opacity="0.78"/>
    <path d="M153 92h44" stroke="#e678a8" stroke-width="7" stroke-linecap="round" opacity="0.72"/>
  </g>
  <text x="226" y="85" class="sans brand">Prism<tspan fill="#55d6e8">TTY</tspan></text>

  <g class="sans">
    <text x="72" y="210" class="headline">Noise becomes</text>
    <text x="72" y="282" class="headline">signal.</text>
    <text x="76" y="346" class="lede">Readable network and Unix output,</text>
    <text x="76" y="380" class="lede">live in the terminal you already use.</text>
    <path d="M76 454h64" stroke="#45c7d8" stroke-width="3"/>
    <text x="76" y="500" class="meta">prismtty.com</text>
    <text x="76" y="532" class="meta">macOS + Linux / MIT licensed</text>
  </g>

  <g filter="url(#terminal-shadow)">
    <rect x="616" y="54" width="520" height="522" rx="30" fill="#0a0d12" stroke="#2a3441" stroke-width="2"/>
    <rect x="624" y="62" width="504" height="506" rx="23" fill="#070b10" stroke="#1b2530"/>
    <path d="M624 122h504" stroke="#202b36"/>
    <circle cx="650" cy="92" r="5" fill="#697582"/>
    <circle cx="670" cy="92" r="5" fill="#697582"/>
    <circle cx="690" cy="92" r="5" fill="#697582"/>
    <text x="714" y="97" class="mono terminal-title">ptty ssh edge-sw1.example.net</text>

    <g class="mono terminal-text">
      <text x="650" y="156"><tspan class="host">ops@workstation%</tspan><tspan> ptty ssh edge-sw1.example.net</tspan></text>
      <text x="650" y="188">Connected to edge-sw1.example.net.</text>
      <text x="650" y="232"><tspan class="host">edge-sw1#</tspan><tspan>show ip interface brief</tspan></text>
      <text x="650" y="264" fill="#8f9ba8">Interface            IP-Address       Status</text>
      <text x="650" y="298"><tspan class="iface">Gi1/0/1</tspan><tspan dx="73" class="ip">192.0.2.10</tspan><tspan dx="63" class="up">up</tspan></text>
      <text x="650" y="330"><tspan class="iface">Gi1/0/2</tspan><tspan dx="73" class="ip">198.51.100.42</tspan><tspan dx="38" class="down">down</tspan></text>
      <text x="650" y="382"><tspan class="host">edge-sw1#</tspan><tspan>show logging | include LINK</tspan></text>
      <text x="650" y="418"><tspan class="severity">%LINK-3-UPDOWN:</tspan></text>
      <text x="650" y="448">Interface <tspan class="iface">Gi1/0/2</tspan> changed state to <tspan class="down">down</tspan></text>
    </g>

    <rect x="650" y="494" width="452" height="46" rx="11" fill="#0d1117" stroke="#202b36"/>
    <circle cx="674" cy="517" r="4" fill="#45c7d8"/>
    <text x="690" y="522" class="mono terminal-title">9 profiles / zero telemetry</text>
  </g>
</svg>
