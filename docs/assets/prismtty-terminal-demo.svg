<svg xmlns="http://www.w3.org/2000/svg" width="615" height="270" viewBox="0 0 615 270" role="img" aria-labelledby="title desc">
  <title id="title">Animated PrismTTY terminal demo</title>
  <desc id="desc">Raw Cisco output from a synthetic session appears line by line in gray, then each line turns into the colors the cisco profile gives it: prompts, interfaces, up and down states and addresses. Real PrismTTY output.</desc>
  <style>
    text { white-space: pre; }
    @media (prefers-reduced-motion: reduce) {
      .raw { display: none; }
      .hl { clip-path: none !important; }
      .play { opacity: 1 !important; }
    }
  </style>
  <g font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#c4c7ce">
    <rect x="0.5" y="0.5" width="614" height="269" rx="14" fill="#0c0e11" stroke="#23252a"/>
    <path d="M1 48.5H614" stroke="#23252a"/>
    <text x="24" y="29" font-size="14" fill="#8b9099" xml:space="preserve">ptty /bin/zsh</text>
    <rect x="454" y="11.5" width="137" height="25" rx="12.5" fill="none" stroke="#2f333b"/>
    <text x="522.5" y="28.5" font-size="13" fill="#c4c7ce" text-anchor="middle" xml:space="preserve">generic + cisco</text>
    <defs>
      <clipPath id="hl">
        <rect x="28" y="72" width="587" height="29"><animate attributeName="x" dur="10s" repeatCount="indefinite" values="-559;-559;28;28" keyTimes="0;0.26;0.35;1"/></rect>
        <rect x="28" y="101" width="587" height="29"><animate attributeName="x" dur="10s" repeatCount="indefinite" values="-559;-559;28;28" keyTimes="0;0.295;0.385;1"/></rect>
        <rect x="28" y="130" width="587" height="29"><animate attributeName="x" dur="10s" repeatCount="indefinite" values="-559;-559;28;28" keyTimes="0;0.33;0.42;1"/></rect>
        <rect x="28" y="159" width="587" height="29"><animate attributeName="x" dur="10s" repeatCount="indefinite" values="-559;-559;28;28" keyTimes="0;0.365;0.455;1"/></rect>
        <rect x="28" y="188" width="587" height="29"><animate attributeName="x" dur="10s" repeatCount="indefinite" values="-559;-559;28;28" keyTimes="0;0.4;0.49;1"/></rect>
        <rect x="28" y="217" width="587" height="29"><animate attributeName="x" dur="10s" repeatCount="indefinite" values="-559;-559;28;28" keyTimes="0;0.435;0.525;1"/></rect>
      </clipPath>
      <clipPath id="raw">
        <rect x="615" y="72" width="587" height="29"><animate attributeName="x" dur="10s" repeatCount="indefinite" values="28;28;615;615" keyTimes="0;0.26;0.35;1"/></rect>
        <rect x="615" y="101" width="587" height="29"><animate attributeName="x" dur="10s" repeatCount="indefinite" values="28;28;615;615" keyTimes="0;0.295;0.385;1"/></rect>
        <rect x="615" y="130" width="587" height="29"><animate attributeName="x" dur="10s" repeatCount="indefinite" values="28;28;615;615" keyTimes="0;0.33;0.42;1"/></rect>
        <rect x="615" y="159" width="587" height="29"><animate attributeName="x" dur="10s" repeatCount="indefinite" values="28;28;615;615" keyTimes="0;0.365;0.455;1"/></rect>
        <rect x="615" y="188" width="587" height="29"><animate attributeName="x" dur="10s" repeatCount="indefinite" values="28;28;615;615" keyTimes="0;0.4;0.49;1"/></rect>
        <rect x="615" y="217" width="587" height="29"><animate attributeName="x" dur="10s" repeatCount="indefinite" values="28;28;615;615" keyTimes="0;0.435;0.525;1"/></rect>
      </clipPath>
    </defs>
    <g class="play" font-size="18">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.92;0.96;1"/>
      <g class="raw" fill="#979aa2" clip-path="url(#raw)">
        <text x="32" y="91.54" opacity="0" xml:space="preserve">edge-sw1#show interfaces description<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.025;0.05;1"/></text>
        <text x="32" y="120.54" opacity="0" xml:space="preserve">Gi1/0/1  up  up  Uplink to core-rtr<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.055;0.08;1"/></text>
        <text x="32" y="149.54" opacity="0" xml:space="preserve">Gi1/0/2  down  down  Spare access port<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.085;0.11;1"/></text>
        <text x="32" y="178.54" opacity="0" xml:space="preserve">Po10  up  up  Bundle to dist-a<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.115;0.14;1"/></text>
        <text x="32" y="207.54" opacity="0" xml:space="preserve">edge-sw1#show ip route ospf<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.145;0.17;1"/></text>
        <text x="32" y="236.54" opacity="0" xml:space="preserve">O  192.0.2.0/24 [110/20] via 198.51.100.1, Vlan1191<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.175;0.2;1"/></text>
      </g>
      <g class="hl" clip-path="url(#hl)">
        <text x="32" y="91.54" xml:space="preserve"><tspan fill="#ffffff">edge-sw1#</tspan>show interfaces description</text>
        <text x="32" y="120.54" xml:space="preserve"><tspan fill="#0099ff">Gi1/0/1</tspan>  <tspan fill="#00ff00">up</tspan>  <tspan fill="#00ff00">up</tspan>  Uplink to core-rtr</text>
        <text x="32" y="149.54" xml:space="preserve"><tspan fill="#0099ff">Gi1/0/2</tspan>  <tspan fill="#ff0000" font-weight="700">down</tspan>  <tspan fill="#ff0000" font-weight="700">down</tspan>  Spare access port</text>
        <text x="32" y="178.54" xml:space="preserve"><tspan fill="#0099ff">Po10</tspan>  <tspan fill="#00ff00">up</tspan>  <tspan fill="#00ff00">up</tspan>  Bundle to dist-a</text>
        <text x="32" y="207.54" xml:space="preserve"><tspan fill="#ffffff">edge-sw1#</tspan>show ip route ospf</text>
        <text x="32" y="236.54" xml:space="preserve">O  <tspan fill="#00ffff">192.0.2.0/24</tspan> [110/20] via <tspan fill="#00ffff">198.51.100.1</tspan>, <tspan fill="#0099ff">Vlan1191</tspan></text>
      </g>
    </g>
  </g>
</svg>
