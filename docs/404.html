<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The two hashes cover this page's inline style and script blocks;
         recompute them if either block changes. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'sha256-1HoK/6DceGx/ZTOeDr0uwFK1R/+CzdUBkgcw1DNSnoE='; style-src 'self' 'sha256-OkCKzZiK/GQSreHcf9cQxvzv9KM7xq099YWFQ56BY7M='; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'"
    >
    <title>404 - PrismTTY</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0a0b0d">
    <link rel="icon" href="/assets/prismtty-mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/site.css">
    <style>
      body {
        position: relative;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100dvh;
      }
      body::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 28%;
        height: 78vh;
        background: url("/assets/hero-light.webp") center / cover no-repeat;
        opacity: 0.4;
        -webkit-mask-image: radial-gradient(closest-side, #000 40%, transparent);
        mask-image: radial-gradient(closest-side, #000 40%, transparent);
        pointer-events: none;
      }
      .nf-top,
      .nf-main {
        position: relative;
      }
      .nf-top {
        padding: 18px max(16px, calc(66 * var(--u)));
      }
      .nf-brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
      }
      .nf-brand .brand-mark {
        width: 40px;
        height: 40px;
      }
      .nf-brand .brand-name {
        font-size: 22px;
      }
      .nf-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: min(760px, calc(100% - 40px));
        margin: 0 auto;
        padding: 32px 0 72px;
      }
      .nf-title {
        margin: 14px 0 0;
        font-size: clamp(34px, 6vw, 56px);
        font-weight: 700;
        line-height: 1.06;
        letter-spacing: -0.025em;
        text-wrap: balance;
      }
      .nf-lede {
        max-width: 46ch;
        margin-top: 16px;
        font-size: 19px;
        font-weight: 300;
        line-height: 1.55;
        color: var(--muted);
      }
      .nf-term {
        margin-top: 36px;
      }
      .nf-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 28px;
      }
      .nf-home,
      .nf-actions .button-ghost {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        width: auto;
        height: 48px;
        padding: 0 20px;
        border-radius: 8px;
        font-size: 16px;
      }
      .nf-home {
        background: var(--text);
        color: var(--ground);
        font-weight: 500;
      }
      .nf-home:hover {
        background: #ffffff;
      }
      .nf-actions .gh-mark {
        width: 20px;
        height: 20px;
      }
      @media (max-width: 1279px) {
        .nf-top {
          padding: 14px 20px;
        }
      }
      @media (max-width: 520px) {
        .nf-actions a {
          flex: 1 1 100%;
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <header class="nf-top">
      <a class="nf-brand" href="/" aria-label="PrismTTY home">
        <img class="brand-mark" src="/assets/prismtty-mark.svg" alt="" width="40" height="40">
        <span class="brand-name">PrismTTY</span>
      </a>
    </header>
    <main class="nf-main">
      <h1 class="nf-title">No page at this address.</h1>
      <p class="nf-lede">The link may be out of date, or the path was mistyped. The switch below had no luck with it either.</p>
      <figure class="term nf-term">
        <div class="term-bar">
          <span class="term-title">ptty /bin/zsh</span>
          <span class="term-badge">generic + cisco</span>
        </div>
        <pre class="out-block"><!-- output:notfound --><span class="ln"><span class="c-ffffff">edge-sw1#</span>show page /does-not-exist</span>
<span class="ln">              ^</span>
<span class="ln">% <span class="c-ff0000 b">Invalid</span> input detected at '^' marker.</span>
<span class="ln"></span>
<span class="ln"><span class="c-ffffff">edge-sw1#</span></span><!-- /output:notfound --></pre>
      </figure>
      <div class="nf-actions">
        <a class="nf-home" href="/">Back to prismtty.com</a>
        <a class="button-ghost" href="https://github.com/inxbit/prismtty">
          <img class="gh-mark" src="/assets/github-mark.svg" alt="" width="20" height="20">
          View on GitHub
        </a>
      </div>
    </main>
    <script>
      // The terminal is real output for /does-not-exist; show the path asked for.
      var line = document.querySelector('.nf-term .ln');
      if (line && location.pathname && location.pathname !== '/') {
        var path = location.pathname.replace(/[^\w\-./]/g, '');
        for (var node = line.firstChild; node; node = node.nextSibling) {
          if (node.nodeType === 3 && node.data.indexOf('/does-not-exist') !== -1) {
            node.data = node.data.replace('/does-not-exist', path);
            break;
          }
        }
      }
    </script>
  </body>
</html>
