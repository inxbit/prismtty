<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The two hashes cover this page's inline style and script blocks;
         recompute them if either block changes. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'sha256-Lep2Au0iMvS6WBqz1Xhod2g6EwC/UOgWhYU5KB4dyTk='; style-src 'self' 'sha256-k+svvbR4VN8FPxLfjZ2pgfdCp0xtuuWpCw2gupEcWkI='; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'"
    >
    <title>404 - PrismTTY</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#07090d">
    <link rel="icon" href="/assets/prismtty-mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <style>
      .nf-wrap {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding: 24px;
      }
      .nf-shell { width: min(640px, 100%); }
      .nf-terminal { width: 100%; }
      .nf-terminal .terminal-body {
        min-height: 0;
        padding: clamp(22px, 5vw, 34px);
        white-space: normal;
      }
      .nf-terminal .t-cmd { overflow-wrap: anywhere; }
      .nf-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 22px;
      }
    </style>
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <main class="nf-wrap">
      <h1 class="sr-only">404: page not found</h1>
      <div class="instrument-shell nf-shell">
        <figure class="terminal nf-terminal">
          <div class="terminal-bar">
            <span class="terminal-lights" aria-hidden="true"><i></i><i></i><i></i></span>
            <span class="terminal-title">ptty /bin/zsh</span>
          </div>
          <div class="terminal-body">
            <span class="tline"><span class="hl-host">visitor@prismtty.com%</span> <span class="t-cmd">open <span id="nf-path">this page</span></span></span>
            <span class="tline"><span class="hl-down">open: no such file or directory (404)</span></span>
            <span class="tline">&nbsp;</span>
            <span class="tline">The page you asked for is not routed here.</span>
            <span class="tline">&nbsp;</span>
            <div class="nf-actions">
              <a class="button primary" href="/">Back to prismtty.com</a>
              <a class="button secondary" href="https://github.com/inxbit/prismtty">GitHub</a>
            </div>
          </div>
        </figure>
      </div>
    </main>
    <script>
      var el = document.getElementById('nf-path');
      if (el && location.pathname && location.pathname !== '/') {
        el.textContent = location.pathname.replace(/[^\w\-./]/g, '');
      }
    </script>
  </body>
</html>
