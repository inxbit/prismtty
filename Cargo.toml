[package]
name = "prismtty"
version = "1.0.11"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Fast terminal output highlighter focused on network devices and Unix systems"
readme = "README.crates.md"
repository = "https://github.com/inxbit/prismtty"
homepage = "https://prismtty.com/"
documentation = "https://docs.rs/prismtty"
keywords = ["terminal", "highlighting", "network", "cli"]
categories = ["command-line-utilities"]

[features]
completion-generation = ["dep:clap_complete"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = { version = "4.5", optional = true }
directories = "6.0"
is-terminal = "0.4"
nix = { version = "0.31", features = ["term", "process", "signal"] }
pcre2 = "0.2"
portable-pty = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_norway = "0.9.42"
thiserror = "2.0"

[dev-dependencies]
assert_cmd = "2.0"
libc = "0.2"
portable-pty = "0.9"
predicates = "3.1"
tempfile = "3.14"

[[bin]]
name = "gen-completions"
path = "src/bin/gen-completions.rs"
required-features = ["completion-generation"]
