<svg xmlns="http://www.w3.org/2000/svg" width="1134" height="690" viewBox="0 0 1134 690" role="img" aria-labelledby="title desc">
  <title id="title">PrismTTY switching profiles across ssh hops</title>
  <desc id="desc">One wrapped shell across four hops of a synthetic session, each block real PrismTTY output for the profile marked on its left: linux-unix on the workstation, cisco pushed after ssh to edge-sw1, juniper pushed after ssh to core-rtr, and juniper popped when that connection closes.</desc>
  <style>
    text { white-space: pre; }
  </style>
  <g font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#c4c7ce">
    <rect x="0.5" y="0.5" width="1133" height="689" rx="14" fill="#0c0e11" stroke="#23252a"/>
    <path d="M1 48.5H1133" stroke="#23252a"/>
    <text x="24" y="29" font-size="14" fill="#8b9099" xml:space="preserve">ptty /bin/zsh</text>
    <rect x="918.4" y="11.5" width="191.6" height="25" rx="12.5" fill="none" stroke="#2f333b"/>
    <text x="1014.2" y="28.5" font-size="13" fill="#c4c7ce" text-anchor="middle" xml:space="preserve">generic + top of stack</text>
    <g font-size="14">
      <rect x="32.5" y="73.5" width="99" height="23" rx="7.5" fill="none" stroke="#3a414c"/>
      <text x="82" y="89.5" fill="#f2f3f5" text-anchor="middle" xml:space="preserve">linux-unix</text>
    </g>
    <g font-size="16">
      <text x="334" y="89.48" xml:space="preserve"><tspan fill="#ffffff">ops@workstation:~$</tspan> ssh admin@edge-sw1.example.net</text>
    </g>
    <path d="M1 122.5H1133" stroke="#191c21"/>
    <g font-size="14">
      <rect x="32.5" y="147.5" width="99" height="23" rx="7.5" fill="none" stroke="#23262c"/>
      <text x="82" y="163.5" fill="#8a9099" text-anchor="middle" xml:space="preserve">linux-unix</text>
      <text x="144.2" y="163.5" fill="#8b9099" text-anchor="middle" xml:space="preserve">+</text>
      <rect x="156.9" y="147.5" width="57" height="23" rx="7.5" fill="none" stroke="#3a414c"/>
      <text x="185.4" y="163.5" fill="#f2f3f5" text-anchor="middle" xml:space="preserve">cisco</text>
    </g>
    <g font-size="16">
      <text x="334" y="163.48" xml:space="preserve"><tspan fill="#ffffff">edge-sw1#</tspan>show ip interface brief</text>
      <text x="334" y="189.48" xml:space="preserve">Interface              IP-Address      <tspan fill="#00ff00">OK</tspan>? Method Status                Protocol</text>
      <text x="334" y="215.48" xml:space="preserve"><tspan fill="#0099ff">GigabitEthernet1/0/1</tspan>   <tspan fill="#00ffff">192.0.2.1</tspan>       YES manual <tspan fill="#00ff00">up</tspan>                    <tspan fill="#00ff00">up</tspan></text>
      <text x="334" y="241.48" xml:space="preserve"><tspan fill="#0099ff">GigabitEthernet1/0/2</tspan>   unassigned      YES unset  administratively <tspan fill="#ff0000" font-weight="700">down</tspan> <tspan fill="#ff0000" font-weight="700">down</tspan></text>
      <text x="334" y="267.48" xml:space="preserve"><tspan fill="#0099ff">Vlan1191</tspan>               <tspan fill="#00ffff">198.51.100.1</tspan>    YES manual <tspan fill="#00ff00">up</tspan>                    <tspan fill="#00ff00">up</tspan></text>
      <text x="334" y="293.48" xml:space="preserve"><tspan fill="#ffffff">edge-sw1#</tspan>ssh -l admin core-rtr.example.net</text>
    </g>
    <path d="M1 326.5H1133" stroke="#191c21"/>
    <g font-size="14">
      <rect x="32.5" y="351.5" width="99" height="23" rx="7.5" fill="none" stroke="#23262c"/>
      <text x="82" y="367.5" fill="#8a9099" text-anchor="middle" xml:space="preserve">linux-unix</text>
      <rect x="140.5" y="351.5" width="57" height="23" rx="7.5" fill="none" stroke="#23262c"/>
      <text x="169" y="367.5" fill="#8a9099" text-anchor="middle" xml:space="preserve">cisco</text>
      <text x="210.2" y="367.5" fill="#8b9099" text-anchor="middle" xml:space="preserve">+</text>
      <rect x="222.9" y="351.5" width="73.8" height="23" rx="7.5" fill="none" stroke="#3a414c"/>
      <text x="259.8" y="367.5" fill="#f2f3f5" text-anchor="middle" xml:space="preserve">juniper</text>
    </g>
    <g font-size="16">
      <text x="334" y="367.48" xml:space="preserve"><tspan fill="#00bfff">admin@core-rtr&gt;</tspan> show interfaces terse ge-0/0/*</text>
      <text x="334" y="393.48" xml:space="preserve">Interface               Admin Link Proto    Local</text>
      <text x="334" y="419.48" xml:space="preserve"><tspan fill="#0099ff">ge-0/0/0</tspan>                <tspan fill="#00ff00">up</tspan>    <tspan fill="#00ff00">up</tspan></text>
      <text x="334" y="445.48" xml:space="preserve"><tspan fill="#0099ff">ge-0/0/0.0</tspan>              <tspan fill="#00ff00">up</tspan>    <tspan fill="#00ff00">up</tspan>   inet     <tspan fill="#00ffff">192.0.2.2/30</tspan></text>
      <text x="334" y="471.48" xml:space="preserve"><tspan fill="#0099ff">ge-0/0/1</tspan>                <tspan fill="#00ff00">up</tspan>    <tspan fill="#ff0000" font-weight="700">down</tspan></text>
      <text x="334" y="497.48" xml:space="preserve"><tspan fill="#00bfff">admin@core-rtr&gt;</tspan> exit</text>
    </g>
    <path d="M1 530.5H1133" stroke="#191c21"/>
    <g font-size="14">
      <rect x="32.5" y="555.5" width="99" height="23" rx="7.5" fill="none" stroke="#23262c"/>
      <text x="82" y="571.5" fill="#8a9099" text-anchor="middle" xml:space="preserve">linux-unix</text>
      <rect x="140.5" y="555.5" width="57" height="23" rx="7.5" fill="none" stroke="#3a414c"/>
      <text x="169" y="571.5" fill="#f2f3f5" text-anchor="middle" xml:space="preserve">cisco</text>
      <text x="210.2" y="571.5" fill="#8b9099" text-anchor="middle" xml:space="preserve">−</text>
      <text x="251.8" y="571.5" fill="#7b8087" text-anchor="middle" xml:space="preserve">juniper</text>
      <path d="M222.4 567.3H281.2" stroke="#7b8087"/>
    </g>
    <g font-size="16">
      <text x="334" y="571.48" xml:space="preserve">Connection to core-rtr.example.net closed.</text>
      <text x="334" y="597.48" xml:space="preserve"><tspan fill="#ffffff">edge-sw1#</tspan></text>
    </g>
    <path d="M1 630.5H1133" stroke="#23252a"/>
    <text x="32" y="667" font-size="14" fill="#8b9099" xml:space="preserve">Real PrismTTY output for the profile marked on the left.</text>
  </g>
</svg>
