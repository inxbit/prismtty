<svg xmlns="http://www.w3.org/2000/svg" width="708" height="382" viewBox="0 0 708 382" role="img" aria-labelledby="title desc">
  <title id="title">PrismTTY highlighting Cisco output</title>
  <desc id="desc">Real PrismTTY output with the cisco profile over a synthetic session: show version, show interfaces description and show ip route, with prompts, interfaces, link states and addresses in color.</desc>
  <style>
    text { white-space: pre; }
  </style>
  <g font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#c4c7ce">
    <rect x="0.5" y="0.5" width="707" height="381" rx="14" fill="#0c0e11" stroke="#23252a"/>
    <path d="M1 48.5H707" stroke="#23252a"/>
    <text x="24" y="29" font-size="14" fill="#8b9099" xml:space="preserve">ptty /bin/zsh</text>
    <rect x="547" y="11.5" width="137" height="25" rx="12.5" fill="none" stroke="#2f333b"/>
    <text x="615.5" y="28.5" font-size="13" fill="#c4c7ce" text-anchor="middle" xml:space="preserve">generic + cisco</text>
    <g font-size="16">
      <text x="32" y="89.48" xml:space="preserve"><tspan fill="#ffffff">LAB-IOS-01#</tspan>show version</text>
      <text x="32" y="115.48" xml:space="preserve">Cisco IOS XE Software, Version 17.09.04</text>
      <text x="32" y="141.48" xml:space="preserve"><tspan fill="#ffffff">LAB-IOS-01#</tspan>show interfaces description</text>
      <text x="32" y="167.48" xml:space="preserve">Interface              Status         Protocol Description</text>
      <text x="32" y="193.48" xml:space="preserve"><tspan fill="#0099ff">Gi1/0/1</tspan>                <tspan fill="#00ff00">up</tspan>             <tspan fill="#00ff00">up</tspan>       Uplink to LAB-CORE</text>
      <text x="32" y="219.48" xml:space="preserve"><tspan fill="#0099ff">Gi1/0/2</tspan>                <tspan fill="#ff0000" font-weight="700">down</tspan>           <tspan fill="#ff0000" font-weight="700">down</tspan>     Spare access port</text>
      <text x="32" y="245.48" xml:space="preserve"><tspan fill="#0099ff">Po10</tspan>                   <tspan fill="#00ff00">up</tspan>             <tspan fill="#00ff00">up</tspan>       Bundle to DIST-A</text>
      <text x="32" y="271.48" xml:space="preserve"><tspan fill="#0099ff">Vlan1191</tspan>               <tspan fill="#00ff00">up</tspan>             <tspan fill="#00ff00">up</tspan>       Synthetic users VLAN</text>
      <text x="32" y="297.48" xml:space="preserve"><tspan fill="#ffffff">LAB-IOS-01#</tspan>show ip route</text>
      <text x="32" y="323.48" xml:space="preserve">O        <tspan fill="#00ffff">192.0.2.0/24</tspan> [110/20] via <tspan fill="#00ffff">198.51.100.1</tspan>, 00:00:14, <tspan fill="#0099ff">Vlan1191</tspan></text>
      <text x="32" y="349.48" xml:space="preserve">B        <tspan fill="#00ffff">203.0.113.0/24</tspan> [20/0] via <tspan fill="#00ffff">198.51.100.2</tspan>, 00:01:02</text>
    </g>
  </g>
</svg>
