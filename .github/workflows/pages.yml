name: Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "tests/site_pages.test.mjs"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "tests/site_pages.test.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify static site contract
        run: node --test tests/site_pages.test.mjs

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
          # Needed only so docs/.nojekyll ships with the artifact; any other
          # hidden file tracked under docs/ would be published too.
          include-hidden-files: true

  deploy:
    name: Deploy Pages site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages-production
      # Let the active deployment finish; the freshness gate prevents an older
      # run from replacing newer Pages content.
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check current Pages content
        id: main-revision
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          built_docs_tree="$(git rev-parse "${GITHUB_SHA}:docs")"
          current_docs_tree="$(git rev-parse "refs/remotes/origin/main:docs")"
          if [[ "$built_docs_tree" == "$current_docs_tree" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale Pages deployment for $GITHUB_SHA; main has newer Pages content."
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.main-revision.outputs.current == 'true'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
