name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: package ${{ matrix.target_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target_name: darwin-aarch64
          - os: macos-13
            target_name: darwin-x86_64
          - os: ubuntu-24.04
            target_name: linux-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install PCRE2
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            brew install pcre2 pkg-config
          else
            sudo apt-get update
            sudo apt-get install -y libpcre2-dev pkg-config
          fi

      - name: Test
        run: cargo test

      - name: Package
        run: bash scripts/package-release.sh "${{ matrix.target_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prismtty-${{ matrix.target_name }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  github-release:
    name: publish GitHub release
    runs-on: ubuntu-24.04
    needs: package
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
