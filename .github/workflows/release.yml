name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: package ${{ matrix.target_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target_name: darwin-aarch64
          - os: macos-15-intel
            target_name: darwin-x86_64
          - os: ubuntu-24.04
            target_name: linux-x86_64

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify release tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable toolchain
        with:
          toolchain: 1.85.0
          components: rustfmt

      - name: Install PCRE2
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            brew install pcre2 pkg-config
          else
            sudo apt-get update
            sudo apt-get install -y libpcre2-dev pkg-config
          fi

      - name: Format check
        run: cargo fmt --check

      - name: Test
        run: cargo test --locked

      - name: Verify generated completions
        run: |
          cargo run --locked --features completion-generation --bin gen-completions
          git diff --exit-code completions/

      - name: Verify static site and release policies
        run: node --test tests/*.test.mjs

      - name: Package
        run: bash scripts/package-release.sh "${{ matrix.target_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prismtty-${{ matrix.target_name }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  release-validation:
    name: validate release
    runs-on: ubuntu-24.04
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    outputs:
      crate-published: ${{ steps.crates-io-state.outputs.published }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify release tag is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable toolchain
        with:
          toolchain: 1.85.0

      - name: Privacy scan
        run: bash scripts/privacy-scan.sh

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked
      - name: cargo audit
        run: cargo audit --deny warnings
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          rust-version: "1.85"
          command: check advisories licenses bans sources

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/release-artifacts
          merge-multiple: true

      - name: Validate artifacts
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/release-artifacts"
          manifest="${RUNNER_TEMP}/release-artifacts.manifest"
          actual="${RUNNER_TEMP}/release-artifacts.actual"
          version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$version" != "$tag_version" ]]; then
            echo "Cargo.toml version $version does not match release tag $GITHUB_REF_NAME."
            exit 1
          fi
          : > "$manifest"
          for target in darwin-aarch64 darwin-x86_64 linux-x86_64; do
            archive="${artifact_dir}/prismtty-${version}-${target}.tar.gz"
            checksum="${archive}.sha256"
            test -f "$archive"
            test -f "$checksum"
            grep -E "^[0-9a-f]{64}  prismtty-${version}-${target}\\.tar\\.gz$" "$checksum"
            (cd "$artifact_dir" && shasum -a 256 -c "$checksum")
            printf '%s\n' "$(basename "$archive")" "$(basename "$checksum")" >> "$manifest"
          done
          LC_ALL=C sort -o "$manifest" "$manifest"
          find "$artifact_dir" -mindepth 1 -maxdepth 1 -exec basename {} \; \
            | LC_ALL=C sort > "$actual"
          if [[ -n "$(comm -3 "$manifest" "$actual")" ]]; then
            echo "Downloaded release artifacts do not match the exact allowlist."
            comm -3 "$manifest" "$actual"
            exit 1
          fi

      - name: Generate Homebrew formula
        run: bash scripts/generate-homebrew-formula.sh "${RUNNER_TEMP}/release-artifacts/prismtty.rb" "${RUNNER_TEMP}/release-artifacts"

      - name: Validate Homebrew formula
        run: |
          set -euo pipefail
          formula="${RUNNER_TEMP}/release-artifacts/prismtty.rb"
          grep -F "version \"${GITHUB_REF_NAME#v}\"" "$formula"
          grep -F 'depends_on "pcre2"' "$formula"
          grep -F "linux-x86_64" "$formula"
          if grep -n -E "REPLACE_WITH|linux-aarch64" "$formula"; then
            echo "Generated Homebrew formula has placeholder checksums or unsupported artifacts."
            exit 1
          fi

      - name: Finalize exact release manifest
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/release-artifacts"
          manifest="${RUNNER_TEMP}/release-artifacts.manifest"
          actual="${RUNNER_TEMP}/release-artifacts.actual"
          digests="${RUNNER_TEMP}/release-artifacts.sha256"
          printf '%s\n' prismtty.rb >> "$manifest"
          LC_ALL=C sort -u -o "$manifest" "$manifest"
          find "$artifact_dir" -mindepth 1 -maxdepth 1 -exec basename {} \; \
            | LC_ALL=C sort > "$actual"
          if [[ -n "$(comm -3 "$manifest" "$actual")" ]]; then
            echo "Final release artifacts do not match the exact allowlist."
            comm -3 "$manifest" "$actual"
            exit 1
          fi
          : > "$digests"
          while IFS= read -r filename; do
            (cd "$artifact_dir" && shasum -a 256 "$filename") >> "$digests"
          done < "$manifest"

      - name: Verify existing GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/release-artifacts"
          manifest="${RUNNER_TEMP}/release-artifacts.manifest"
          response="${RUNNER_TEMP}/github-release.json"
          status="$(curl --silent --show-error --location --retry 3 --retry-all-errors \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$response" --write-out '%{http_code}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}")"
          case "$status" in
            404)
              exit 0
              ;;
            200)
              ;;
            *)
              echo "GitHub release lookup failed with HTTP $status."
              cat "$response"
              exit 1
              ;;
          esac
          EXPECTED_TAG="$GITHUB_REF_NAME" python3 - "$response" "$manifest" "$artifact_dir" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys

          response_path, manifest_path, artifact_dir = map(Path, sys.argv[1:])
          with response_path.open(encoding="utf-8") as response_file:
              payload = json.load(response_file)
          expected_tag = os.environ["EXPECTED_TAG"]
          if payload.get("tag_name") != expected_tag:
              raise SystemExit(
                  f"GitHub returned tag {payload.get('tag_name')!r}, expected {expected_tag!r}"
              )
          expected_names = [
              line for line in manifest_path.read_text(encoding="utf-8").splitlines() if line
          ]
          if len(expected_names) != len(set(expected_names)):
              raise SystemExit("release artifact manifest contains duplicate names")
          expected = set(expected_names)
          seen = set()
          for asset in payload.get("assets", []):
              name = asset.get("name")
              if not isinstance(name, str) or name in seen:
                  raise SystemExit(f"duplicate or invalid release asset: {name!r}")
              seen.add(name)
              if name not in expected:
                  raise SystemExit(f"unexpected release asset: {name}")
              local_digest = hashlib.sha256((artifact_dir / name).read_bytes()).hexdigest()
              remote_digest = asset.get("digest")
              if remote_digest != f"sha256:{local_digest}":
                  raise SystemExit(
                      f"release asset digest mismatch for {name}: "
                      f"remote={remote_digest!r} local='sha256:{local_digest}'"
                  )
          PY

      - name: Package crate for publication verification
        id: crate-package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cargo package --locked
          crate="target/package/prismtty-${version}.crate"
          test -f "$crate"
          checksum="$(shasum -a 256 "$crate" | awk '{print $1}')"
          if [[ ! "$checksum" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Failed to calculate the packaged crate checksum."
            exit 1
          fi
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Check crates.io publication state
        id: crates-io-state
        env:
          EXPECTED_CRATE_CHECKSUM: ${{ steps.crate-package.outputs.checksum }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          response="${RUNNER_TEMP}/crates-io-version.json"
          status="$(curl --silent --show-error --location --retry 3 --retry-all-errors \
            --user-agent "prismtty-release/${version} (https://github.com/inxbit/prismtty)" \
            --output "$response" --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/prismtty/${version}")"
          case "$status" in
            200)
              EXPECTED_VERSION="$version" python3 - "$response" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as response_file:
              payload = json.load(response_file)
          version_record = payload.get("version", {})
          actual = version_record.get("num")
          expected = os.environ["EXPECTED_VERSION"]
          if actual != expected:
              raise SystemExit(
                  f"crates.io returned version {actual!r}, expected {expected!r}"
              )
          if version_record.get("yanked") is not False:
              raise SystemExit(f"crates.io version {expected} is yanked or indeterminate")
          published_checksum = version_record.get("checksum")
          expected_checksum = os.environ["EXPECTED_CRATE_CHECKSUM"].lower()
          if not isinstance(published_checksum, str) or len(published_checksum) != 64:
              raise SystemExit(
                  f"crates.io version {expected} has a missing or invalid checksum"
              )
          if published_checksum.lower() != expected_checksum:
              raise SystemExit(
                  f"crates.io version {expected} checksum does not match tagged source"
              )
          PY
              echo "published=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "crates.io version check failed with HTTP $status."
              cat "$response"
              exit 1
              ;;
          esac

      - name: Upload validated release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-release-artifacts
          path: |
            ${{ runner.temp }}/release-artifacts
            ${{ runner.temp }}/release-artifacts.manifest
            ${{ runner.temp }}/release-artifacts.sha256
          if-no-files-found: error

  release-publish:
    name: publish release
    runs-on: ubuntu-24.04
    needs: release-validation
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable toolchain
        with:
          toolchain: 1.85.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release-artifacts
          path: ${{ runner.temp }}/validated-release

      - name: Seal exact release artifact set
        id: release-artifacts
        run: |
          set -euo pipefail
          bundle_dir="${RUNNER_TEMP}/validated-release"
          artifact_dir="${bundle_dir}/release-artifacts"
          sealed_dir="${RUNNER_TEMP:?RUNNER_TEMP is required}/sealed-release-artifacts"
          manifest="${bundle_dir}/release-artifacts.manifest"
          actual="${RUNNER_TEMP}/release-artifacts.actual"
          digests="${bundle_dir}/release-artifacts.sha256"
          find "$artifact_dir" -mindepth 1 -maxdepth 1 -exec basename {} \; \
            | LC_ALL=C sort > "$actual"
          if [[ -n "$(comm -3 "$manifest" "$actual")" ]]; then
            echo "Final release artifacts changed after validation."
            comm -3 "$manifest" "$actual"
            exit 1
          fi
          (cd "$artifact_dir" && shasum -a 256 -c "$digests")
          rm -rf "$sealed_dir"
          mkdir -p "$sealed_dir"
          {
            echo 'paths<<EOF'
            while IFS= read -r filename; do
              source_file="${artifact_dir}/${filename}"
              test -f "$source_file"
              test ! -L "$source_file"
              install -m 0644 "$source_file" "${sealed_dir}/${filename}"
              printf '%s\n' "${sealed_dir}/${filename}"
            done < "$manifest"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Attest release artifacts
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ${{ steps.release-artifacts.outputs.paths }}

      - name: Publish release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ github.ref_name }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: ${{ steps.release-artifacts.outputs.paths }}

      - name: Authenticate with crates.io
        id: crates-io-auth
        if: needs.release-validation.outputs.crate-published != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crate
        if: needs.release-validation.outputs.crate-published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo publish --locked --no-verify
