name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install PCRE2
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            brew install pcre2 pkg-config
          else
            sudo apt-get update
            sudo apt-get install -y libpcre2-dev pkg-config
          fi
      - run: cargo fmt --check
      - run: cargo test
      - name: Privacy scan
        run: |
          PATTERN='(/Users/[^[:space:]]+/(Desktop|Documents)|Desktop/[A-Za-z0-9_.-]+\.txt)'
          if rg -n "$PATTERN" . --glob '!target/**' --glob '!Cargo.lock' --glob '!.github/workflows/ci.yml'; then
            echo "Sensitive real-world capture marker found. Use synthetic fixtures instead."
            exit 1
          fi
      - run: cargo build --release
