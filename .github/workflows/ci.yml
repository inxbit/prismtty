name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-audit
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-audit@0.22.1
      - name: cargo audit
        run: cargo audit --deny warnings
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.85"
          command: check advisories licenses bans sources

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable toolchain
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install PCRE2
        # Ubuntu runners regularly stall reaching the Azure package mirror over
        # IPv6, which held this step for hours before it was bounded. Force
        # IPv4, bound every fetch, and retry the whole step a few times so a
        # stalled mirror costs a minute instead of the job.
        timeout-minutes: 10
        run: |
          apt_get() {
            sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@"
          }
          for attempt in 1 2 3; do
            if timeout 120 bash -c "$(declare -f apt_get); apt_get update" \
              && timeout 120 bash -c "$(declare -f apt_get); apt_get install -y --no-install-recommends libpcre2-dev pkg-config"; then
              exit 0
            fi
            if [[ "${attempt}" == "1" ]]; then
              # The runner's regional mirror can be down outright. Fall back to
              # the canonical archive for the remaining attempts.
              echo "switching off the regional Ubuntu mirror"
              sudo sed -i 's|http://[a-z0-9.-]*archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
                /etc/apt/apt-mirrors.txt /etc/apt/sources.list 2>/dev/null || true
              sudo sed -i 's|http://[a-z0-9.-]*archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
                /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
            fi
            echo "apt attempt ${attempt} failed; retrying"
            sleep 5
          done
          echo "apt could not install the PCRE2 build dependency"
          exit 1
      - run: cargo test --locked

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable toolchain
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install PCRE2
        # Ubuntu runners regularly stall reaching the Azure package mirror over
        # IPv6, which held this step for hours before it was bounded. Force
        # IPv4, bound every fetch, and retry the whole step a few times so a
        # stalled mirror costs a minute instead of the job.
        timeout-minutes: 10
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            brew install pcre2 pkg-config
            exit 0
          fi
          apt_get() {
            sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@"
          }
          for attempt in 1 2 3; do
            if timeout 120 bash -c "$(declare -f apt_get); apt_get update" \
              && timeout 120 bash -c "$(declare -f apt_get); apt_get install -y --no-install-recommends libpcre2-dev pkg-config"; then
              exit 0
            fi
            if [[ "${attempt}" == "1" ]]; then
              # The runner's regional mirror can be down outright. Fall back to
              # the canonical archive for the remaining attempts.
              echo "switching off the regional Ubuntu mirror"
              sudo sed -i 's|http://[a-z0-9.-]*archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
                /etc/apt/apt-mirrors.txt /etc/apt/sources.list 2>/dev/null || true
              sudo sed -i 's|http://[a-z0-9.-]*archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
                /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
            fi
            echo "apt attempt ${attempt} failed; retrying"
            sleep 5
          done
          echo "apt could not install the PCRE2 build dependency"
          exit 1
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - name: Verify generated completions
        run: |
          cargo run --locked --features completion-generation --bin gen-completions
          git diff --exit-code completions/
      - name: Privacy scan
        run: bash scripts/privacy-scan.sh
      - name: Verify static site and release policies
        run: node --test tests/*.test.mjs
      - name: Verify Homebrew formula generator
        run: |
          tmp="$(mktemp -d)"
          version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          checksum="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          for target in darwin-aarch64 darwin-x86_64 linux-x86_64; do
            printf '%s  prismtty-%s-%s.tar.gz\n' "$checksum" "$version" "$target" > "$tmp/prismtty-${version}-${target}.tar.gz.sha256"
          done
          bash scripts/generate-homebrew-formula.sh "$tmp/prismtty.rb" "$tmp"
          grep -F "/releases/download/v${version}/prismtty-${version}-darwin-aarch64.tar.gz" "$tmp/prismtty.rb"
          if grep -n -E '^\s*version "' "$tmp/prismtty.rb"; then
            echo "Generated Homebrew formula must derive its version from the URLs."
            exit 1
          fi
          grep -F 'depends_on "pcre2"' "$tmp/prismtty.rb"
          grep -F "linux-x86_64" "$tmp/prismtty.rb"
          if grep -n -E "REPLACE_WITH|linux-aarch64" "$tmp/prismtty.rb"; then
            echo "Generated Homebrew formula has placeholder checksums or unsupported artifacts."
            exit 1
          fi
      - run: cargo build --locked --release
